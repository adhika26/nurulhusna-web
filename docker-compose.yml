services:
  db:
    image: postgres:17-alpine
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nurulhusna
      POSTGRES_DB: nurulhusna
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nurulhusna"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
